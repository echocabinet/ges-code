app-id: com.geshl2.GESource
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: gesource-installer

finish-args:
  # Access home so we can find ~/.local/share/Steam, ~/.steam, ~/.var/app/...Steam, etc.
  - --filesystem=home
  # Wayland + X11 for kdialog dialogs
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

modules:
  - name: gesource-installer
    buildsystem: simple
    build-commands:
      - install -Dm755 installer.sh /app/bin/gesource-installer
      - install -Dm644 com.geshl2.GESource.desktop
          /app/share/applications/com.geshl2.GESource.desktop
      - install -Dm644 com.geshl2.GESource.metainfo.xml
          /app/share/metainfo/com.geshl2.GESource.metainfo.xml
    sources:
      - type: file
        path: installer.sh
      - type: file
        path: com.geshl2.GESource.desktop
      - type: file
        path: com.geshl2.GESource.metainfo.xml
